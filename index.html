<!DOCTYPE html>
<html>
<head>
  <title>mishoa.id 🍜</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-4xl font-bold text-center text-orange-500">🍜 Mishoa.id</h1>
<p class="text-center mb-6 text-gray-600">Hangat dalam 3 menit 😋</p>

<!-- PRODUK -->
<div class="grid md:grid-cols-3 gap-6 mb-10">

  <!-- AYAM BAWANG -->
  <div class="bg-white p-4 rounded-xl shadow">
    <img src="https://via.placeholder.com/300x200?text=Ayam+Bawang" class="rounded mb-2">
    <h2 class="font-bold">Mishoa Ayam Bawang</h2>
    <p>Rp15.000</p>
    <button onclick="addToCart('Ayam Bawang',15000)" class="bg-orange-500 text-white w-full mt-2 p-2 rounded">+ Keranjang</button>
  </div>

  <!-- LAKSA -->
  <div class="bg-white p-4 rounded-xl shadow">
    <img src="https://via.placeholder.com/300x200?text=Laksa" class="rounded mb-2">
    <h2 class="font-bold">Mishoa Laksa</h2>
    <p>Rp18.000</p>
    <button onclick="addToCart('Laksa',18000)" class="bg-orange-500 text-white w-full mt-2 p-2 rounded">+ Keranjang</button>
  </div>

  <!-- GORENG -->
  <div class="bg-white p-4 rounded-xl shadow">
    <img src="https://via.placeholder.com/300x200?text=Goreng" class="rounded mb-2">
    <h2 class="font-bold">Mishoa Goreng</h2>
    <p>Rp17.000</p>
    <button onclick="addToCart('Goreng',17000)" class="bg-orange-500 text-white w-full mt-2 p-2 rounded">+ Keranjang</button>
  </div>

</div>

<!-- KERANJANG -->
<div class="bg-white p-6 rounded-xl shadow max-w-xl mx-auto">
  <h2 class="text-xl font-bold mb-3">🛒 Keranjang</h2>
  <div id="cart"></div>

  <input id="nama" placeholder="Nama" class="border p-2 w-full mt-3">
  <input id="alamat" placeholder="Alamat" class="border p-2 w-full mt-3">

  <h3 class="mt-3 font-bold">Total: Rp <span id="total">0</span></h3>

  <button onclick="checkout()" class="bg-green-500 text-white w-full mt-4 p-3 rounded">
    Checkout via WhatsApp
  </button>
</div>

<script>
let cart = []

function addToCart(nama, harga){
  let item = cart.find(i => i.nama === nama)
  if(item){
    item.qty++
  } else {
    cart.push({nama, harga, qty:1})
  }
  renderCart()
}

function renderCart(){
  let html = ""
  let total = 0
  let totalQty = 0

  cart.forEach(i=>{
    let sub = i.harga * i.qty
    total += sub
    totalQty += i.qty

    html += `<div class="flex justify-between border-b py-1">
      <span>${i.nama} x${i.qty}</span>
      <span>Rp${sub}</span>
    </div>`
  })

  // PROMO: BELI 3 GRATIS 1
  let bonus = Math.floor(totalQty / 3)

  if(bonus > 0){
    html += `<div class="text-green-600 font-bold mt-2">
      🎁 Bonus Ayam Bawang x${bonus}
    </div>`
  }

  document.getElementById('cart').innerHTML = html
  document.getElementById('total').innerText = total
}

function checkout(){
   let orderId = new Date().getTime().toString().slice(-6)

  let text = `Halo kak, saya mau order:
Order#${orderId}

`

  let total = 0
  let totalQty = 0

  cart.forEach(i=>{
    text += `• ${i.nama} x${i.qty} - Rp${i.harga*i.qty}\n`
    total += i.harga * i.qty
    totalQty += i.qty
  })

  let bonus = Math.floor(totalQty / 3)
  if(bonus > 0){
    text += `\n🎁 Bonus Ayam Bawang x${bonus}`
  }

  text += `\n\n💰 Total: Rp${total}`

  let nama = document.getElementById('nama').value
  let alamat = document.getElementById('alamat').value

  text += `\n👤 Nama: ${nama}`
  text += `\n📍 Alamat: ${alamat}`

  window.open("https://wa.me/6282112007575?text=" + encodeURIComponent(text))
}
</script>

</body>
</html>
