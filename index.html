<script>
let cart = []

function scrollToCart(){
  document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})
}

function animateAdd(e){
  let rect = e.target.getBoundingClientRect()
  let el = document.createElement('div')
  el.innerText = '🍜'
  el.className = 'fly'
  el.style.left = rect.left+'px'
  el.style.top = rect.top+'px'
  document.body.appendChild(el)
  setTimeout(()=>{
    el.style.left = window.innerWidth - 80 + 'px'
    el.style.top = window.innerHeight - 80 + 'px'
    el.style.opacity = 0
  },10)
  setTimeout(()=>el.remove(),700)
}

function addToCart(nama, harga, e){
  animateAdd(e)
  let item = cart.find(i => i.nama === nama)
  if(item){
    item.qty += 1
  } else {
    cart.push({nama, harga, qty:1})
  }
  renderCart()
}

function tambahQty(nama){
  let item = cart.find(i => i.nama === nama)
  if(item){ item.qty += 1 }
  renderCart()
}

function kurangQty(nama){
  let item = cart.find(i => i.nama === nama)
  if(item){
    item.qty -= 1
    if(item.qty <= 0){
      cart = cart.filter(i => i.nama !== nama)
    }
  }
  renderCart()
}

function hapusItem(nama){
  cart = cart.filter(i => i.nama !== nama)
  renderCart()
}

function renderCart(){
  let html = ""
  let total = 0
  let count = 0

  cart.forEach(item=>{
    let sub = item.harga * item.qty
    total += sub
    count += item.qty

    html += `
    <div class="flex justify-between items-center border-b py-2">
      <div>
        <p>${item.nama}</p>
        <div>
          <button onclick="kurangQty('${item.nama}')">-</button>
          <span>${item.qty}</span>
          <button onclick="tambahQty('${item.nama}')">+</button>
        </div>
      </div>
      <div>
        Rp${sub}
        <button onclick="hapusItem('${item.nama}')">hapus</button>
      </div>
    </div>`
  })

  let totalQty = cart.reduce((sum,i)=>sum+i.qty,0)
  let bonus = Math.floor(totalQty / 3)

  if(bonus > 0){
    html += `<p>Bonus Ayam Bawang x${bonus}</p>`
  }

  document.getElementById('cart').innerHTML = html
  document.getElementById('total').innerText = total
  document.getElementById('cartCount').innerText = count
}

function checkout(){
  let orderId = new Date().getTime().toString().slice(-6)

  let text = `Halo kak, saya mau order:
Order#${orderId}

`

  let total = 0
  let totalQty = 0

  cart.forEach(i=>{
    text += `- ${i.nama} x${i.qty} - Rp${i.harga*i.qty}\n`
    total += i.harga * i.qty
    totalQty += i.qty
  })

  let bonus = Math.floor(totalQty / 3)
  if(bonus > 0){
    text += `\nBonus Ayam Bawang x${bonus}`
  }

  text += `\n\nTotal: Rp${total}`

  let nama = document.getElementById('nama').value
  let alamat = document.getElementById('alamat').value

  text += `\nNama: ${nama}`
  text += `\nAlamat: ${alamat}`

  window.open("https://wa.me/6282112007575?text=" + encodeURIComponent(text))
}
</script>
