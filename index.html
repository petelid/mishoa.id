<!DOCTYPE html>
<html>
<head>
  <title>Mishoa.id 🍜</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-3xl font-bold text-center text-orange-500 mb-4">🍜 Mishoa.id</h1>

<!-- CART BUTTON -->
<div onclick="scrollToCart()" class="fixed bottom-6 right-6 bg-orange-500 text-white px-4 py-2 rounded-full cursor-pointer">
  🛒 <span id="cartCount">0</span>
</div>

<!-- PRODUK -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

  <!-- AYAM BAWANG -->
  <div class="bg-white p-4 rounded shadow">
    <img src="https://images.unsplash.com/photo-1512058564366-c9e3e0468a98?auto=format&fit=crop&w=600&q=80" class="rounded mb-2">
    <h2 class="font-bold">Ayam Bawang</h2>
    <p class="text-orange-500">Rp15000</p>
    <button onclick="addToCart('Ayam Bawang',15000)" class="bg-orange-500 text-white w-full mt-2">Tambah</button>
  </div>

  <!-- LAKSA -->
  <div class="bg-white p-4 rounded shadow">
    <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=600&q=80" class="rounded mb-2">
    <h2 class="font-bold">Laksa</h2>
    <p class="text-orange-500">Rp18000</p>
    <button onclick="addToCart('Laksa',18000)" class="bg-orange-500 text-white w-full mt-2">Tambah</button>
  </div>

  <!-- GORENG -->
  <div class="bg-white p-4 rounded shadow">
    <img src="https://images.unsplash.com/photo-1612929633738-8fe44f7ec841?auto=format&fit=crop&w=600&q=80" class="rounded mb-2">
    <h2 class="font-bold">Goreng</h2>
    <p class="text-orange-500">Rp17000</p>
    <button onclick="addToCart('Goreng',17000)" class="bg-orange-500 text-white w-full mt-2">Tambah</button>
  </div>

</div>

<!-- CART -->
<div id="cartSection" class="bg-white p-4 mt-6 rounded shadow">
  <h2 class="font-bold mb-2">Keranjang</h2>
  <div id="cart"></div>

  <input id="nama" placeholder="Nama" class="border p-2 w-full mt-2">
  <input id="alamat" placeholder="Alamat" class="border p-2 w-full mt-2">

  <p class="mt-2">Total: Rp <span id="total">0</span></p>

  <button onclick="checkout()" class="bg-green-500 text-white w-full mt-3 p-2">
    Checkout WhatsApp
  </button>
</div>

<script>
let cart = []

function scrollToCart(){
  document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})
}

function addToCart(nama, harga){
  let item = cart.find(i => i.nama === nama)
  if(item){ item.qty += 1 }
  else { cart.push({nama, harga, qty:1}) }
  renderCart()
}

function tambahQty(nama){
  let item = cart.find(i => i.nama === nama)
  if(item){ item.qty++ }
  renderCart()
}

function kurangQty(nama){
  let item = cart.find(i => i.nama === nama)
  if(item){
    item.qty--
    if(item.qty <= 0){
      cart = cart.filter(i => i.nama !== nama)
    }
  }
  renderCart()
}

function hapusItem(nama){
  cart = cart.filter(i => i.nama !== nama)
  renderCart()
}

function renderCart(){
  let html = ""
  let total = 0
  let totalQty = 0

  cart.forEach(item=>{
    let sub = item.harga * item.qty
    total += sub
    totalQty += item.qty

    html += `
    <div class="flex justify-between border-b py-2">
      <div>
        ${item.nama}
        <button onclick="kurangQty('${item.nama}')">-</button>
        ${item.qty}
        <button onclick="tambahQty('${item.nama}')">+</button>
      </div>
      <div>
        Rp${sub}
        <button onclick="hapusItem('${item.nama}')">x</button>
      </div>
    </div>`
  })

  let bonus = Math.floor(totalQty / 3)
  if(bonus > 0){
    html += `<p class="text-green-600 mt-2">🎁 Bonus Ayam Bawang x${bonus}</p>`
  }

  document.getElementById('cart').innerHTML = html
  document.getElementById('total').innerText = total
  document.getElementById('cartCount').innerText = totalQty
}

function checkout(){
  let orderId = new Date().getTime().toString().slice(-6)

  let text = "Halo kak, saya mau order:\nOrder#" + orderId + "\n\n"

  let total = 0
  let totalQty = 0

  cart.forEach(i=>{
    text += "- " + i.nama + " x" + i.qty + " - Rp" + (i.harga*i.qty) + "\n"
    total += i.harga*i.qty
    totalQty += i.qty
  })

  let bonus = Math.floor(totalQty / 3)
  if(bonus > 0){
    text += "\nBonus Ayam Bawang x" + bonus
  }

  text += "\n\nTotal: Rp" + total

  let nama = document.getElementById('nama').value
  let alamat = document.getElementById('alamat').value

  text += "\nNama: " + nama
  text += "\nAlamat: " + alamat

  window.open("https://wa.me/6282112007575?text=" + encodeURIComponent(text))
}
</script>

</body>
</html>
